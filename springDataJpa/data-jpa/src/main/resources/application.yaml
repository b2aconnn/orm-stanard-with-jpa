spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/datajpa
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        # show_sql: true
        format_sql: true
        # default_batch_fetch_size: 1000 #최적화 옵션

  # spring data에서 pageable 설정
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 2000

# write log File
logging.level:
  org.hibernate.SQL: debug
# 파라미터까지 볼 수 있음
#  org.hibernate.type: trace